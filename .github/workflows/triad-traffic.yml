name: TRIAD Traffic (offline)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  traffic-offline:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify offline time axis, TTP markers and secret redaction
        shell: pwsh
        run: ./scripts/Test-TriadTraffic.ps1
      - name: No test output in tracked source
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) { Write-Host $dirty; throw 'The traffic test modified repository source.' }
          Write-Host 'SOURCE TREE CLEAN'